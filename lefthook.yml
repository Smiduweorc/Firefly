# Installed by the "prepare" script on `npm install` inside a git repository.
# YAML requires spaces for indentation, so this file does not use the tabs the
# rest of the repo does.
pre-commit:
    parallel: true
    commands:
        lint:
            glob: "*.{js,mjs,cjs,ts,tsx}"
            run: npx eslint {staged_files}

commit-msg:
    commands:
        commitlint:
            run: npx commitlint --edit {1}
